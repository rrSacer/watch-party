<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sala – Watch Party</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#0f1115;color:#e8e8ea;font-family:system-ui,sans-serif;height:100vh;display:flex;flex-direction:column}
  header{display:flex;gap:12px;align-items:center;padding:10px 16px;background:#171a21;font-size:.9rem;flex-wrap:wrap}
  header .sp{flex:1}
  button,label.btn{background:#2a2f3a;color:#e8e8ea;border:0;border-radius:8px;padding:8px 14px;cursor:pointer;font-size:.9rem}
  button:hover,label.btn:hover{background:#363c4a}
  button.primary{background:#e5484d}
  #layout{flex:1;display:flex;min-height:0}
  #stage{flex:1;display:flex;align-items:center;justify-content:center;background:#000;position:relative;min-width:0}
  video{width:100%;height:100%;max-height:100%;background:#000}
  #upload{text-align:center;padding:24px}
  #upload p{color:#9aa0aa}
  progress{width:260px}
  #chat{width:280px;display:flex;flex-direction:column;background:#171a21}
  #msgs{flex:1;overflow-y:auto;padding:12px;font-size:.85rem}
  #msgs div{margin-bottom:8px;word-break:break-word}
  #msgs .ev{color:#9aa0aa;font-style:italic}
  #msgs b{color:#7aa2ff}
  #chat form{display:flex;gap:6px;padding:8px}
  #chat input{flex:1;min-width:0;background:#0f1115;border:1px solid #2a2f3a;color:#e8e8ea;border-radius:8px;padding:8px}
  .hidden{display:none!important}
  @media(max-width:720px){#layout{flex-direction:column}#chat{width:100%;height:30vh}}
</style>
</head>
<body>
<header>
  <strong>Watch Party</strong>
  <span id="count">1 online</span>
  <span class="sp"></span>
  <label class="btn" id="subBtn" class="hidden">Legenda (.srt/.vtt)<input id="subFile" type="file" accept=".srt,.vtt" hidden></label>
  <label class="btn">Trocar vídeo<input id="swapFile" type="file" accept="video/*,.mkv" hidden></label>
  <button class="primary" id="copy">Copiar link</button>
</header>
<div id="layout">
  <div id="stage">
    <div id="upload">
      <h2>Envie o vídeo</h2>
      <p>MP4 (H.264) ou WebM funcionam em qualquer navegador. Seu amigo verá o vídeo assim que o envio terminar.</p>
      <label class="btn primary">Escolher arquivo<input id="file" type="file" accept="video/*,.mkv" hidden></label>
      <p id="status"></p>
      <progress id="bar" max="1" value="0" class="hidden"></progress>
    </div>
    <video id="v" controls class="hidden" playsinline></video>
  </div>
  <aside id="chat">
    <div id="msgs"></div>
    <form id="form"><input id="txt" placeholder="Mensagem…" autocomplete="off"><button>Enviar</button></form>
  </aside>
</div>

<script>
const room = location.pathname.split('/').pop();
const $ = (id) => document.getElementById(id);
const v = $('v');
let nick = localStorage.getItem('wp-nick') || prompt('Seu nome:') || 'Anônimo';
localStorage.setItem('wp-nick', nick);

const ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/?room=' + room);
const send = (o) => ws.readyState === 1 && ws.send(JSON.stringify(o));
ws.onopen = () => send({ type: 'nick', nick });

// Evita eco: eventos disparados por comandos remotos não são reenviados.
let remote = 0;
function applyRemote(fn) {
  remote++;
  Promise.resolve(fn()).catch(() => {}).finally(() => setTimeout(() => remote--, 300));
}

function log(text, cls) {
  const d = document.createElement('div');
  if (cls) d.className = cls;
  d.innerHTML = text;
  $('msgs').appendChild(d);
  $('msgs').scrollTop = 1e9;
}
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmt = (t) => { t = Math.floor(t); return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0'); };

function loadVideo(state) {
  $('upload').classList.add('hidden');
  v.classList.remove('hidden');
  v.src = '/video/' + room + '?t=' + Date.now();
  v.addEventListener('loadedmetadata', () => applyState(state), { once: true });
}
function loadSub() {
  v.querySelectorAll('track').forEach((t) => t.remove());
  const t = document.createElement('track');
  t.kind = 'subtitles'; t.label = 'Legenda'; t.srclang = 'pt'; t.default = true;
  t.src = '/sub/' + room + '?t=' + Date.now();
  v.appendChild(t);
}
function applyState(s) {
  const target = s.time;
  applyRemote(async () => {
    if (Math.abs(v.currentTime - target) > 0.3) v.currentTime = target;
    if (s.playing && v.paused) await v.play();
    if (!s.playing && !v.paused) v.pause();
  });
}

ws.onmessage = (e) => {
  const m = JSON.parse(e.data);
  switch (m.type) {
    case 'init': if (m.hasVideo) loadVideo(m.state); if (m.sub) loadSub(); break;
    case 'video': loadVideo(m.state); log('Novo vídeo: ' + esc(m.name), 'ev'); break;
    case 'sub': loadSub(); log('Legenda carregada', 'ev'); break;
    case 'count': $('count').textContent = m.n + ' online'; break;
    case 'chat': log('<b>' + esc(m.nick) + ':</b> ' + esc(m.text)); break;
    case 'play': log(esc(m.nick) + ' deu play em ' + fmt(m.time), 'ev'); applyState(m.state); break;
    case 'pause': log(esc(m.nick) + ' pausou em ' + fmt(m.time), 'ev'); applyState(m.state); break;
    case 'seek': log(esc(m.nick) + ' pulou para ' + fmt(m.time), 'ev'); applyState(m.state); break;
    case 'state': applyState(m.state); break;
  }
};

// Ações locais -> todos
v.addEventListener('play', () => !remote && send({ type: 'play', time: v.currentTime }));
v.addEventListener('pause', () => !remote && send({ type: 'pause', time: v.currentTime }));
v.addEventListener('seeked', () => !remote && send({ type: 'seek', time: v.currentTime }));

// Correção de deriva: se alguém ficou para trás (ex.: buffering), pede o estado.
setInterval(() => { if (!v.classList.contains('hidden') && !v.paused) send({ type: 'sync' }); }, 5000);
ws.addEventListener('message', (e) => {
  const m = JSON.parse(e.data);
  if (m.type === 'state' && m.state.playing && Math.abs(v.currentTime - m.state.time) > 1.5) applyState(m.state);
});

// Upload
function upload(file, kind) {
  if (!file) return;
  const xhr = new XMLHttpRequest();
  xhr.open('POST', '/upload/' + room + (kind === 'sub' ? '?kind=sub' : ''));
  xhr.setRequestHeader('X-Filename', encodeURIComponent(file.name));
  if (kind !== 'sub') {
    $('upload').classList.remove('hidden'); v.classList.add('hidden'); v.pause();
    $('bar').classList.remove('hidden');
    xhr.upload.onprogress = (e) => { $('bar').value = e.loaded / e.total; $('status').textContent = 'Enviando… ' + Math.round(e.loaded / e.total * 100) + '%'; };
  }
  xhr.onload = () => { if (xhr.status !== 200) { alert(xhr.responseText || 'Erro no envio'); $('status').textContent = ''; } else $('status').textContent = ''; $('bar').classList.add('hidden'); };
  xhr.send(file);
}
$('file').onchange = (e) => upload(e.target.files[0]);
$('swapFile').onchange = (e) => upload(e.target.files[0]);
$('subFile').onchange = (e) => upload(e.target.files[0], 'sub');

function copyText(t) {
  if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(t);
  const a = document.createElement('textarea'); a.value = t; document.body.appendChild(a); a.select();
  document.execCommand('copy'); a.remove();
}
$('copy').onclick = () => { copyText(location.href); $('copy').textContent = 'Copiado!'; setTimeout(() => $('copy').textContent = 'Copiar link', 1500); };
$('form').onsubmit = (e) => { e.preventDefault(); const t = $('txt').value.trim(); if (t) send({ type: 'chat', text: t }); $('txt').value = ''; };
</script>
</body>
</html>
