<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sala – Watch Party</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#0f1115;color:#e8e8ea;font-family:system-ui,sans-serif;height:100vh;display:flex;flex-direction:column}
  header{display:flex;gap:12px;align-items:center;padding:10px 16px;background:#171a21;font-size:.9rem;flex-wrap:wrap}
  header .sp{flex:1}
  button,label.btn{background:#2a2f3a;color:#e8e8ea;border:0;border-radius:8px;padding:8px 14px;cursor:pointer;font-size:.9rem}
  button:hover,label.btn:hover{background:#363c4a}
  button.primary{background:#e5484d}
  #layout{flex:1;display:flex;min-height:0}
  #stage{flex:1;display:flex;align-items:center;justify-content:center;background:#000;position:relative;min-width:0}
  video{width:100%;height:100%;max-height:100%;background:#000}
  #upload{text-align:center;padding:24px}
  #upload p{color:#9aa0aa}
  progress{width:260px}
  #chat{width:280px;display:flex;flex-direction:column;background:#171a21}
  #msgs{flex:1;overflow-y:auto;padding:12px;font-size:.85rem}
  #msgs div{margin-bottom:8px;word-break:break-word}
  #msgs .ev{color:#9aa0aa;font-style:italic}
  #msgs b{color:#7aa2ff}
  #chat form{display:flex;gap:6px;padding:8px}
  #chat input{flex:1;min-width:0;background:#0f1115;border:1px solid #2a2f3a;color:#e8e8ea;border-radius:8px;padding:8px}
  #wait,#gate{position:absolute;left:50%;transform:translateX(-50%);z-index:5}
  #wait{top:12px;background:#000c;color:#fff;padding:8px 14px;border-radius:8px;font-size:.9rem}
  #gate{top:50%;transform:translate(-50%,-50%);background:#e5484d;color:#fff;padding:16px 28px;font-size:1.1rem}
  .hidden{display:none!important}
  @media(max-width:720px){#layout{flex-direction:column}#chat{width:100%;height:30vh}}
</style>
</head>
<body>
<header>
  <strong>Watch Party</strong>
  <span id="count">1 online</span>
  <span class="sp"></span>
  <label class="btn" id="subBtn" class="hidden">Legenda (.srt/.vtt)<input id="subFile" type="file" accept=".srt,.vtt" hidden></label>
  <label class="btn">Trocar vídeo<input id="swapFile" type="file" accept="video/*,.mkv" hidden></label>
  <button class="primary" id="copy">Copiar link</button>
</header>
<div id="layout">
  <div id="stage">
    <div id="upload">
      <h2>Envie o vídeo</h2>
      <p>MP4 (H.264) ou WebM funcionam em qualquer navegador. Seu amigo verá o vídeo assim que o envio terminar.</p>
      <label class="btn primary">Escolher arquivo<input id="file" type="file" accept="video/*,.mkv" hidden></label>
      <p id="status"></p>
      <progress id="bar" max="1" value="0" class="hidden"></progress>
    </div>
    <div id="wait" class="hidden"></div>
    <button id="gate" class="hidden">▶ Clique para entrar na sincronia</button>
    <video id="v" controls class="hidden" playsinline></video>
  </div>
  <aside id="chat">
    <div id="msgs"></div>
    <form id="form"><input id="txt" placeholder="Mensagem…" autocomplete="off"><button>Enviar</button></form>
  </aside>
</div>

<script>
const room = location.pathname.split('/').pop();
const $ = (id) => document.getElementById(id);
const v = $('v');
let nick = localStorage.getItem('wp-nick') || prompt('Seu nome:') || 'Anônimo';
localStorage.setItem('wp-nick', nick);

let ws, myId = null, curVid = null, rtt = 0, lastState = null;
const send = (o) => ws && ws.readyState === 1 && ws.send(JSON.stringify(o));

function connect() {
  ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/?room=' + room);
  ws.onopen = () => { send({ type: 'nick', nick }); $('count').style.opacity = 1; };
  ws.onmessage = onMessage;
  ws.onclose = () => { $('count').style.opacity = .4; $('count').textContent = 'reconectando…'; setTimeout(connect, 1000); };
}

// --- Sincronização ---
// O servidor é o dono do relógio. Daqui só saem intenções (play, pause, pular); a posição vem sempre dele.

// Eco: o evento causado por um comando do servidor é ignorado; o que a pessoa faz sempre vale.
let expectPlay = false, expectPause = false, quietPauseUntil = 0;
function remotePause() { expectPause = true; v.pause(); }
async function remotePlay() {
  expectPlay = true;
  try { await v.play(); }
  // Play bloqueado pelo navegador pode gerar um "pause" logo em seguida; esse não vale como ação da pessoa.
  catch (err) { expectPlay = false; quietPauseUntil = Date.now() + 500; throw err; }
}

// Depois de a pessoa dar play ou pause, as respostas periódicas são ignoradas até o servidor confirmar,
// para o vídeo não piscar de volta ao estado anterior.
let intentAt = 0;
const intentPending = () => Date.now() - intentAt < 1500;
function sendIntent(type) { intentAt = Date.now(); send({ type }); }

// Pulos: cada pulo pedido por este código é contado; qualquer outro pulo é da pessoa.
let pendingRemote = 0, remoteTarget = 0, seekStart = 0, seekCost = 0.3;
let localSeek = false, seekN = 0, seekSendTimer = null, seekSentAt = 0;
function remoteSeek(t) {
  if (v.duration) t = Math.min(t, Math.max(0, v.duration - 0.25));
  pendingRemote++; remoteTarget = t; seekStart = performance.now();
  v.currentTime = t;
}
// Enquanto a pessoa arrasta a barra (e até o servidor confirmar o pulo), a posição dela não é corrigida.
const seekHold = () => localSeek && (seekSendTimer !== null || Date.now() - seekSentAt < 3000);
function userSeek() {
  localSeek = true;
  clearTimeout(seekSendTimer);
  // Arrastar a barra gera muitos pulos seguidos; só o último é enviado.
  seekSendTimer = setTimeout(() => {
    seekSendTimer = null; seekSentAt = Date.now();
    send({ type: 'seek', time: v.currentTime, n: ++seekN });
  }, 250);
}

function log(text, cls) {
  const d = document.createElement('div');
  if (cls) d.className = cls;
  d.innerHTML = text;
  $('msgs').appendChild(d);
  $('msgs').scrollTop = 1e9;
}
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmt = (t) => { t = Math.floor(t); return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0'); };

// Carregamento: o grupo só espera este cliente quando ele está de fato sem vídeo para tocar.
// "Pronto" exige alguns segundos já baixados à frente, para não voltar a travar logo em seguida.
v.preload = 'auto';
let buffering = false, stallTimer = null, need = 3, lastStall = 0;
function ahead() {
  for (let i = 0; i < v.buffered.length; i++) {
    if (v.buffered.start(i) <= v.currentTime + 0.2 && v.buffered.end(i) > v.currentTime) return v.buffered.end(i) - v.currentTime;
  }
  return 0;
}
function setBuffering(b) {
  if (b === buffering) return;
  buffering = b;
  send({ type: b ? 'buffering' : 'ready' });
}
function checkReady() {
  if (!buffering || !v.src || v.seeking || v.readyState < 2) return;
  const a = ahead();
  if (a >= need || (v.duration && v.currentTime + a >= v.duration - 0.5)) setBuffering(false);
}

function loadVideo(m) {
  curVid = m.vid;
  lastState = m.state;
  $('upload').classList.add('hidden');
  v.classList.remove('hidden');
  buffering = false; need = 3;
  setBuffering(true); // o grupo espera este cliente carregar
  v.src = '/video/' + room + '?v=' + m.vid;
}
// Com o vídeo aberto, pede a posição atual do grupo (a que veio junto com o aviso já está velha).
v.addEventListener('loadedmetadata', () => send({ type: 'sync', t: Date.now() }));
function loadSub() {
  v.querySelectorAll('track').forEach((t) => t.remove());
  const t = document.createElement('track');
  t.kind = 'subtitles'; t.label = 'Legenda'; t.srclang = 'pt'; t.default = true;
  t.src = '/sub/' + room + '?t=' + Date.now();
  v.appendChild(t);
}

// Aplica o estado do grupo. lat = atraso da rede em SEGUNDOS, somado só quando o vídeo está tocando.
function applyState(s, lat) {
  lastState = s;
  const w = $('wait');
  if (s.waiting && s.waiting.length) { w.textContent = 'Aguardando ' + s.waiting.join(', ') + ' carregar…'; w.classList.remove('hidden'); }
  else w.classList.add('hidden');
  if (v.classList.contains('hidden') || !v.src || v.readyState < 1) return;
  const hold = seekHold();
  if (!s.playing) {
    v.playbackRate = 1;
    if (!v.paused) remotePause();
    // Tolerância de 0,5s: com rede lenta o aviso de pausa chega atrasado, e não vale a pena voltar o vídeo por isso.
    if (!hold && Math.abs(s.time - v.currentTime) > 0.5) remoteSeek(s.time);
    return;
  }
  const target = s.time + lat;
  const diff = target - v.currentTime;
  if (hold) { /* a pessoa está pulando: não mexe na posição */ }
  // Pulo em andamento: espera terminar, a menos que o grupo já esteja em outro trecho.
  else if (v.seeking) { if (diff < -1 || diff > 6) remoteSeek(target + seekCost); }
  // Diferença grande: pula, já contando o tempo que o próprio pulo leva.
  else if (Math.abs(diff) > 1) { v.playbackRate = 1; remoteSeek(target + seekCost); }
  // Diferença pequena: acelera ou desacelera até 10%, sem pulo.
  else v.playbackRate = Math.abs(diff) < 0.08 ? 1 : 1 + Math.max(-0.1, Math.min(0.1, diff * 0.3));
  if (v.paused) {
    remotePlay().then(() => $('gate').classList.add('hidden'))
      .catch((err) => { if (err.name === 'NotAllowedError') $('gate').classList.remove('hidden'); });
  }
}
// Navegador bloqueou o play automático: o clique só libera o vídeo neste aparelho, não mexe no grupo.
$('gate').onclick = () => { $('gate').classList.add('hidden'); remotePlay().then(() => send({ type: 'sync', t: Date.now() })).catch(() => {}); };

function onMessage(e) {
  const m = JSON.parse(e.data);
  const lat = rtt / 2000;
  switch (m.type) {
    case 'init':
      myId = m.id;
      if (m.hasVideo && m.vid !== curVid) loadVideo(m);
      else if (m.hasVideo) { applyState(m.state, lat); if (buffering) send({ type: 'buffering' }); } // reconexão
      if (m.sub) loadSub();
      break;
    case 'video': loadVideo(m); log('Novo vídeo: ' + esc(m.name), 'ev'); break;
    case 'sub': loadSub(); log('Legenda carregada', 'ev'); break;
    case 'count': $('count').textContent = m.n + ' online'; break;
    case 'chat': log('<b>' + esc(m.nick) + ':</b> ' + esc(m.text)); break;
    case 'play': case 'pause': case 'seek': {
      if (m.from !== myId) {
        const what = { play: 'deu play em ', pause: 'pausou em ', seek: 'pulou para ' }[m.type];
        log(esc(m.nick) + ' ' + what + fmt(m.time), 'ev');
      }
      if (m.type !== 'seek') intentAt = 0;
      else if (m.from === myId && m.n === seekN && seekSendTimer === null) localSeek = false;
      applyState(m.state, lat);
      break;
    }
    case 'state': {
      if (m.ack) intentAt = 0;
      if (!m.reply) { applyState(m.state, lat); break; }
      const sample = Date.now() - m.reply; // ida e volta, em milissegundos
      const late = rtt && sample > 2 * rtt + 150; // resposta atrasada: a posição nela já está velha
      rtt = rtt ? rtt * 0.7 + sample * 0.3 : sample;
      if (!late && !intentPending()) applyState(m.state, sample / 2000);
      break;
    }
  }
}

// Ações da pessoa -> servidor
v.addEventListener('play', () => {
  if (expectPlay) { expectPlay = false; return; }
  // Grupo já tocando (ex.: este aparelho estava parado sozinho): só realinha, sem mexer nos outros.
  if (lastState && lastState.playing) send({ type: 'sync', t: Date.now() });
  else sendIntent('play');
});
v.addEventListener('pause', () => {
  if (expectPause) { expectPause = false; return; }
  if (v.seeking || Date.now() <= quietPauseUntil) return;
  if (lastState && lastState.playing) sendIntent('pause');
});
v.addEventListener('seeking', () => {
  if (pendingRemote > 0 && Math.abs(v.currentTime - remoteTarget) < 0.3) pendingRemote--;
  else userSeek();
  if (ahead() < 1) setBuffering(true); // trecho ainda não baixado: o grupo espera
});
v.addEventListener('seeked', () => {
  if (v.seeking) return;
  pendingRemote = 0;
  if (seekStart && !v.paused) seekCost = Math.min(3, seekCost * 0.5 + (performance.now() - seekStart) / 2000);
  seekStart = 0;
});

// Engasgo de menos de 1,2s não segura o grupo. Acima disso, avisa e só libera com folga baixada;
// se os engasgos se repetem, a folga exigida dobra (até 24s) para pausar menos vezes.
v.addEventListener('waiting', () => {
  clearTimeout(stallTimer);
  stallTimer = setTimeout(() => {
    if (v.paused || v.readyState >= 3 || buffering) return;
    const now = Date.now();
    need = now - lastStall < 90000 ? Math.min(need * 2, 24) : 3;
    lastStall = now;
    setBuffering(true);
  }, 1200);
});
v.addEventListener('playing', () => clearTimeout(stallTimer));
['canplay', 'canplaythrough', 'playing', 'seeked', 'progress', 'timeupdate'].forEach((ev) => v.addEventListener(ev, checkReady));
setInterval(checkReady, 500);

// Verificação contínua: a cada 2s compara com o relógio do servidor e corrige.
setInterval(() => { if (!v.classList.contains('hidden') && v.src) send({ type: 'sync', t: Date.now() }); }, 2000);

connect();

// Upload
function upload(file, kind) {
  if (!file) return;
  const xhr = new XMLHttpRequest();
  xhr.open('POST', '/upload/' + room + (kind === 'sub' ? '?kind=sub' : ''));
  xhr.setRequestHeader('X-Filename', encodeURIComponent(file.name));
  if (kind !== 'sub') {
    $('upload').classList.remove('hidden'); v.classList.add('hidden'); v.pause();
    $('bar').classList.remove('hidden');
    xhr.upload.onprogress = (e) => { $('bar').value = e.loaded / e.total; $('status').textContent = 'Enviando… ' + Math.round(e.loaded / e.total * 100) + '%'; };
  }
  xhr.onload = () => { if (xhr.status !== 200) { alert(xhr.responseText || 'Erro no envio'); $('status').textContent = ''; } else $('status').textContent = ''; $('bar').classList.add('hidden'); };
  xhr.send(file);
}
$('file').onchange = (e) => upload(e.target.files[0]);
$('swapFile').onchange = (e) => upload(e.target.files[0]);
$('subFile').onchange = (e) => upload(e.target.files[0], 'sub');

function copyText(t) {
  if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(t);
  const a = document.createElement('textarea'); a.value = t; document.body.appendChild(a); a.select();
  document.execCommand('copy'); a.remove();
}
$('copy').onclick = () => { copyText(location.href); $('copy').textContent = 'Copiado!'; setTimeout(() => $('copy').textContent = 'Copiar link', 1500); };
$('form').onsubmit = (e) => { e.preventDefault(); const t = $('txt').value.trim(); if (t) send({ type: 'chat', text: t }); $('txt').value = ''; };
</script>
</body>
</html>
